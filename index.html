        <noscript>
          <p>Kontovia ist eine Buchhaltung für Selbstständige und kleine Betriebe, die ganz im Browser läuft:
          Einnahmen und Ausgaben, Belege, Rechnungen und E-Rechnungen, Mahnungen, Kontoauszüge, Anlage EÜR,
          Umsatzsteuer-Voranmeldung und DATEV-Export. Ihre Buchhaltung bleibt verschlüsselt auf Ihrem Gerät.</p>
          <p><strong>Kontovia ist noch in Entwicklung.</strong> Für Daten und Ergebnisse gibt es, soweit gesetzlich zulässig, keine Haftung und keine Gewährleistung.</p>
